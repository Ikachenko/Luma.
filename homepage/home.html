<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"> 
</head>
<body id="body">
    <!-- Top bar -->
    <div class="top-bar">
        <div class="button-container">
            <div class="dropdownContainer">
                <button>
                    <i class="bi bi-grid-3x3-gap-fill" id="dropdownButton"></i>
                </button>
                <div class="dropdownContent">
                    <div class="dropdownContentContainer">    
                        <span>Google</span>
                        <a href="https://www.google.com" target="_blank">
                            <i class="bi bi-app"></i>
                            Google
                        </a>  
                        <a href="https://www.youtube.com">
                            <i class="bi bi-app"></i>
                            YouTube
                        </a>
                        <a href="https://www.netflix.com">
                            <i class="bi bi-app"></i>
                            Netflix
                        </a>
                        <a href="https://www.amazon.com">
                            <i class="bi bi-app"></i>
                            Amazon
                        </a>
                        <a href="https://www.reddit.com">
                            <i class="bi bi-app"></i>
                            Reddit
                        </a>
                        <a href="https://www.twitter.com">
                            <i class="bi bi-app"></i>
                            Twitter
                        </a>
                        <a href="https://www.facebook.com">
                            <i class="bi bi-app"></i>
                            Facebook
                        </a>
                        <a href="https://www.instagram.com">
                            <i class="bi bi-app"></i>
                            Instagram
                        </a>
                        <a href="https://www.tiktok.com">
                            <i class="bi bi-app"></i>
                            TikTok
                        </a>
                        <a href="https://www.linkedin.com">
                            <i class="bi bi-app"></i>
                            LinkedIn
                        </a>
                        <a href="https://www.pinterest.com">
                            <i class="bi bi-app"></i>
                            Pinterest
                        </a>
                    </div>
                </div>
            </div>
            <button>
                <i class="bi bi-gear" id="settingsButton"></i>
            </button>
            <button>
                <i class="bi bi-chat-heart"></i>
            </button>
            <a href="https://github.com/Ikachenko/Luma." target="_blank">
                <button>
                    <i class="bi bi-github"></i>    
                </button>
            </a>    
        </div>
    </div>

    <div class="settings" id="settings">
    </div>

    <!-- Main content -->
    <div class="main-content">
        <div class="clock">
            <span id="time">12:00:00</span>
        </div>
        <script src="clock.js"></script>

        <div class="searchbar-container">
            <form class="searchbar" action="https://www.google.com/search" method="GET">
                <input type="text" name="q" id="search" placeholder="Search Google..." autocomplete="off">               
                <button id="clearSearch" type="button">
                    <i class="bi bi-x" style="font-size: 30px;"></i>
                </button>
                <button class="submit" type="submit">
                    <i class="bi bi-search"></i>
                </button>
            </form>
        </div>
    </div>
    <script src="input-clear.js"></script>
    <script src="dropdown-click.js"></script>
    <script src="settings-window.js"></script>
</body>
